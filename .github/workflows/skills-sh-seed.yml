name: skills-sh-seed

on:
  push:
    branches: [ops/skills-sh-seed]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install every published software-factory skill through the public CLI
        env:
          DISABLE_TELEMETRY: ""
          DO_NOT_TRACK: ""
        run: |
          set -euo pipefail
          npx --yes skills add https://github.com/zozo123/ariflow-swfactory \
            --skill airflow-software-factory \
            --skill swfactory \
            --agent codex \
            --global \
            --yes
          npx --yes skills list --global --agent codex

      - name: Probe canonical skills.sh pages
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://skills.sh/zozo123/ariflow-swfactory \
            https://skills.sh/zozo123/ariflow-swfactory/airflow-software-factory \
            https://skills.sh/zozo123/ariflow-swfactory/swfactory
          do
            code=$(curl -L -sS -o /tmp/page -w '%{http_code}' "$url")
            title=$(grep -o -m1 '<title>[^<]*' /tmp/page | sed 's/<title>//' || true)
            echo "$code $url $title"
          done
