name: polyglot-task-graph

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: polyglot-task-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  polyglot-task-graph:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      UV_NO_CONFIG: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Lockfile still describes the native uv workspace
        run: uv lock --check

      - run: uv sync --locked

      - name: Focused architecture tests
        run: uv run pytest tests/test_polyglot_task_graph.py

      - name: Prove native Cargo and uv packages are discovered
        run: |
          mkdir -p .factory/turbo
          npx --yes turbo@2.11.1 ls --output=json > .factory/turbo/packages.json
          for package in swfactory-rust swfactory-python swfactory-contract-fixtures swf-domain swf-adapters swf-app swf-cli swf-tui; do
            grep -q "\"name\"[[:space:]]*:[[:space:]]*\"$package\"" .factory/turbo/packages.json || {
              echo "::error::Turbo did not discover $package natively"
              cat .factory/turbo/packages.json
              exit 1
            }
          done

      - name: Resolve the cross-language graph without executing it
        run: |
          npx --yes turbo@2.11.1 run '//#polyglot-verification' --dry-run=json > .factory/turbo/plan.json

      - name: Execute the cross-language graph
        run: npx --yes turbo@2.11.1 run '//#polyglot-verification' --summarize

      - name: Measure affectedness, clean/cold equivalence, and warm no-op reuse
        run: |
          uv run python scripts/polyglot_benchmark.py --out .factory/turbo/benchmark.json
          cat .factory/turbo/benchmark.json

      - name: Keep advisory graph and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-polyglot-graph-${{ github.run_id }}
          path: |
            .factory/turbo/plan.json
            .factory/turbo/packages.json
            .factory/turbo/benchmark.json
            .turbo/runs/*.json
          if-no-files-found: warn
