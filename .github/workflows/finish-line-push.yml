name: finish-line-push

on:
  push:
    branches: [feat/islo-first-class]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/islo-first-class
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Apply validated hardening and SRT startup fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/finish-line.yml').read_text()
          begin = "          python - <<'PY'\n"
          end = "\n          PY\n"
          start = workflow.index(begin) + len(begin)
          stop = workflow.index(end, start)
          code = textwrap.dedent(workflow[start:stop])
          exec(compile(code, 'finish-line.yml', 'exec'))

          p = Path('src/swfactory/sandbox.py')
          text = p.read_text()
          old = '''        self.root.mkdir(parents=True, exist_ok=True)\n        self.write_settings()\n        if not (self.root / ".git").exists():\n'''
          new = '''        self.root.mkdir(parents=True, exist_ok=True)\n        # bubblewrap cannot install a denyWrite mount on a missing path. Pre-create the\n        # fixed protected directories on the trusted orchestrator side before the first\n        # sandboxed command; empty directories are never committed.\n        for rel in SRT_FIXED_DENY_WRITE:\n            (self.root / rel).mkdir(parents=True, exist_ok=True)\n        self.write_settings()\n        if not (self.root / ".git").exists():\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('SrtSandbox.ensure patch context missing')
              p.write_text(text.replace(old, new, 1))
          PY
      - run: uv sync --group airflow
      - run: uv run ruff format .
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: bash -n deploy/islo/bootstrap.sh deploy/islo/deploy.sh deploy/islo/knowledge.sh deploy/islo/orchestrator/start.sh
      - name: Commit code-only release hardening
        run: |
          # The Actions token has contents:write but not workflows:write. Restore workflows so
          # this commit contains only normal repo files; workflow hardening/cleanup is written
          # through the GitHub connector after this validated commit lands.
          git checkout origin/feat/islo-first-class -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden production path and SRT sandbox startup"
          git push origin HEAD:feat/islo-first-class
