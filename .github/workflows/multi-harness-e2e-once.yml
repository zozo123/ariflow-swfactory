name: multi-harness-e2e-once

on:
  push:
    branches: [hardening/final-open-issues]
    paths: [.github/workflows/multi-harness-e2e-once.yml]

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SWF_GATE_SETTLE_SECS: "8"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/final-open-issues
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: uv sync --group airflow
      - name: Apply literal multi-harness live scenario
        run: |
          uv run python scripts/enable_multi_harness_e2e_once.py
          rm scripts/enable_multi_harness_e2e_once.py
          uv run ruff check scripts/multi_harness_submit.py
          uv run ruff format --check scripts/multi_harness_submit.py
          bash -n scripts/swf_e2e.sh
          git diff --check
      - name: Prove four successful runs plus fenced duplicate on one real backend and Airflow
        run: bash scripts/swf_e2e.sh --backend
      - name: Push verified E2E script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/swf_e2e.sh scripts/enable_multi_harness_e2e_once.py
          git diff --cached --check
          git commit -m 'E2E: prove concurrent multi-harness factories on one Airflow'
          git push origin HEAD:hardening/final-open-issues
