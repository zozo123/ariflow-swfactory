name: skills-sh-discovery-once

on:
  push:
    branches:
      - skills/skills-sh-discovery
    paths:
      - .github/workflows/skills-sh-discovery-once.yml

permissions:
  contents: write

jobs:
  discover-and-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: skills/skills-sh-discovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Patch README with official skills.sh discovery links
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          badge = '  <a href="https://skills.sh/zozo123/ariflow-swfactory"><img alt="skills.sh" src="https://skills.sh/b/zozo123/ariflow-swfactory" /></a>\n'
          license_badge = '  <a href="LICENSE"><img alt="License: Apache-2.0" src="https://img.shields.io/badge/license-Apache--2.0-D22128" /></a>\n'
          if badge not in text:
              if license_badge not in text:
                  raise SystemExit("README badge anchor not found")
              text = text.replace(license_badge, license_badge + badge, 1)

          nav_old = '  <a href="docs/swf.md">CLI &amp; TUI</a> ·\n  <a href="CONTRIBUTING.md">Contributing</a>'
          nav_new = '  <a href="docs/swf.md">CLI &amp; TUI</a> ·\n  <a href="#agent-skill">Agent skill</a> ·\n  <a href="CONTRIBUTING.md">Contributing</a>'
          if '#agent-skill' not in text:
              if nav_old not in text:
                  raise SystemExit("README nav anchor not found")
              text = text.replace(nav_old, nav_new, 1)

          section = '''## Agent skill

Install the factory as an agent skill through Vercel's open `skills` ecosystem:

```sh
npx skills add zozo123/ariflow-swfactory --skill airflow-software-factory
```

Or use it without installing:

```sh
npx skills use zozo123/ariflow-swfactory@airflow-software-factory
```

[Browse **airflow-software-factory** on skills.sh](https://skills.sh/zozo123/ariflow-swfactory/airflow-software-factory) ·
[Read the skill source](skills/airflow-software-factory/SKILL.md)

The skill lives at the standard `skills/airflow-software-factory/SKILL.md` discovery path, so the
Vercel `skills` CLI can find it directly from this repository.

'''
          marker = '## Why a software factory?\n'
          if '## Agent skill\n' not in text:
              if marker not in text:
                  raise SystemExit("README section anchor not found")
              text = text.replace(marker, section + marker, 1)

          path.write_text(text)
          PY

      - name: Validate Vercel skills discovery locally
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --list
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill airflow-software-factory --agent codex -y

      - name: Exercise public GitHub source for skills.sh indexing
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          npx --yes skills@latest add zozo123/ariflow-swfactory --skill airflow-software-factory --agent codex -y

      - name: Commit README discovery surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README already linked"
            exit 0
          fi
          git add README.md
          git commit -m "docs: expose agent skill through skills.sh"
          git push origin HEAD:skills/skills-sh-discovery
