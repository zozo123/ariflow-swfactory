name: rebase-2117-service-hook

on:
  push:
    branches: [fix/2052-docker-identity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preserve scheduled-admission logic and add Docker sweep hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/swfactory/backend/service.py')
          text = path.read_text()
          hook = '                docker=maintain.select_containers(os.environ),\n'
          if hook not in text:
              call_needle = '                control=self.control,\n            )\n        if path == "/metrics/runs":'
              call_replacement = '                control=self.control,\n' + hook + '            )\n        if path == "/metrics/runs":'
              if call_needle not in text:
                  raise SystemExit('sweep call anchor moved')
              text = text.replace(call_needle, call_replacement, 1)

          comment = '            # A docker factory (``SWF_SANDBOX=docker``) sweeps its labelled work containers the same\n'
          if comment not in text:
              comment_needle = '            # journal keeps every removal intent so a lost ``islo rm`` reply is reconciled, not printed.\n            ttl_s = body.get("ttl_s")'
              comment_replacement = (
                  '            # journal keeps every removal intent so a lost ``islo rm`` reply is reconciled, not printed.\n'
                  + comment
                  + '            # way (#2052); any other factory never runs ``docker`` here.\n'
                  + '            ttl_s = body.get("ttl_s")'
              )
              if comment_needle not in text:
                  raise SystemExit('sweep comment anchor moved')
              text = text.replace(comment_needle, comment_replacement, 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/swfactory/backend/service.py
          git diff --cached --quiet && exit 0
          git commit -m 'Resolve #2117 service hook on current main'
          git push
