name: final-format-2040

on:
  push:
    branches: [finish/all-2040]
    paths:
      - ops/run-final-format-2040.json

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Canonicalize lint and formatting
        run: |
          uv run ruff check --fix .
          uv run ruff format .
      - name: Commit canonical output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: canonicalize final #2040 fan-in"
          git push origin "HEAD:${GITHUB_REF_NAME}"
