name: format-liquid-v1

on:
  push:
    branches: [stabilize/liquid-all]
    paths:
      - ops/run-format-liquid-v1.json

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Apply canonical Ruff formatting
        run: uv run ruff format src/swfactory/liquid_*.py src/swfactory/legacy_*.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/swfactory/liquid_*.py src/swfactory/legacy_*.py; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/swfactory/liquid_*.py src/swfactory/legacy_*.py
          git commit -m "style: format liquid implementation wave"
          git push origin "HEAD:${GITHUB_REF_NAME}"
