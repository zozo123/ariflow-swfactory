name: harness-foundation-patch
on:
  push:
    branches: [harness/foundation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'apply harness foundation')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harness/foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/apply_harness_foundation.py
      - name: Commit patched product code
        run: |
          if git diff --quiet; then
            echo 'no patch changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/swf-app/src/submit.rs rust/crates/swf-app/src/ops.rs rust/crates/swf-cli/src/cli.rs rust/crates/swf-cli/src/exec.rs rust/crates/swf-cli/src/render.rs rust/crates/swf-tui/src/effect.rs
          git commit -m 'apply harness foundation'
          git push origin HEAD:harness/foundation
