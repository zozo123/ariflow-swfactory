name: final-normalize-once

on:
  push:
    branches: [stabilize/final-2040]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilize/final-2040
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync
      - run: uv run ruff check . --fix || true
      - run: uv run ruff format .
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: normalize final 2040 fan-in"
            git push
          fi
