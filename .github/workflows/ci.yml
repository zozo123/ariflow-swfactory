name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: e2e demo (scripted agent, local runner, local git remote)
        run: uv run swfactory demo

  airflow-parity:
    # One DAG per blueprints/*.toml mirrors the blueprint (parity), the default line runs end to
    # end through `dag.test()` with the gates marked success (smoke; HITL never resolves itself),
    # and the stress line runs 2 issues x 2 targets to prove the mapped jobs never collide.
    # Named explicitly because the `test` job has no airflow group, so these three skip there.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --group airflow
      - run: >-
          uv run --group airflow pytest
          tests/test_dag_parity.py tests/test_dag_smoke.py tests/test_dag_stress.py

  srt-smoke:
    # Anthropic Sandbox Runtime (bubblewrap on Linux) confining the scripted demo: no model, no
    # ANTHROPIC key. srt is a beta research preview, so this job may not block merges yet.
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Install bubblewrap + socat and allow unprivileged user namespaces (Ubuntu 24.04)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Anthropic Sandbox Runtime
        run: npm i -g @anthropic-ai/sandbox-runtime@0.0.75 && srt --version
      - run: uv sync
      - name: demo under srt (scripted agent, kernel-enforced write confinement)
        run: uv run swfactory demo --sandbox srt

  # Fully local sandbox: build the sandbox image and run the scripted demo with one container per
  # command (ubuntu runners have a Docker daemon). Optional until it has been green for two weeks.
  docker-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: docker build -t swfactory-sandbox:local -f deploy/docker/sandbox.Dockerfile .
      - run: SWF_DOCKER_IMAGE=swfactory-sandbox:local uv run swfactory demo --sandbox docker

  # Forward-compat: the same DAG parity + smoke tests against Airflow's upstream `main`
  # (3.4.0.dev) built from source. Optional until it has been green for two weeks.
  airflow-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - name: Install Airflow core, task-sdk and standard provider from apache/airflow@main
        run: |
          uv pip install \
            "apache-airflow-core @ git+https://github.com/apache/airflow.git@main#subdirectory=airflow-core" \
            "apache-airflow-task-sdk @ git+https://github.com/apache/airflow.git@main#subdirectory=task-sdk" \
            "apache-airflow-providers-standard @ git+https://github.com/apache/airflow.git@main#subdirectory=providers/standard"
          uv run --no-sync python -c "import airflow; print('airflow', airflow.__version__)"
      - run: uv run --no-sync pytest tests/test_dag_parity.py tests/test_dag_smoke.py
