name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m swfactory.liquid_spec
      - run: uv run python -m swfactory.capability_inventory
      - name: e2e demo (scripted agent, local runner, local git remote)
        run: uv run swfactory demo

  # The scripted eval suite is part of final fan-in, not a best-effort side workflow. It is
  # hermetic and keyless, so there is no reason to omit it from candidate acceptance.
  eval-suite:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run python -m swfactory.evals --suite demo/evals
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-eval-runs
          path: |
            .factory/evals/*/*/run/report.json
            .factory/evals/*/*/run/pr.md
            .factory/evals/*/*/run/stages.jsonl
          if-no-files-found: ignore

  # Expensive integration gates run only for main fan-in PRs and main pushes. Internal liquid
  # fan-out PRs get the fast Python gate above, which keeps 10-50 issue bundles cheap to iterate.
  airflow-parity:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --group airflow
      - run: >-
          uv run --group airflow pytest
          tests/test_dag_parity.py tests/test_dag_smoke.py tests/test_dag_stress.py

  # This exercises a real approval gate against a real scheduler. It remains advisory because its
  # hosted-runner timing path is not yet a supported release claim; the supported Airflow path is
  # blocked below by airflow-main and airflow-parity.
  live-gate-e2e:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SWF_GATE_SETTLE_SECS: "8"
      SWF_STRESS_SETTLE_POLLS: "4"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: uv sync --group airflow
      - name: swf drives a live Airflow end to end (2 issues x 2 targets, 8 gates, 4 deliveries)
        id: rust_harness
        continue-on-error: true
        run: bash scripts/swf_e2e.sh
      - name: the Python control room answers the same gates on the same shape of run
        id: python_harness
        if: always()
        continue-on-error: true
        run: bash scripts/stress_airflow.sh
      - name: Keep scheduler evidence when either harness fails
        if: >-
          always() &&
          (steps.rust_harness.outcome != 'success' || steps.python_harness.outcome != 'success')
        run: |
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name 'standalone.log' -newermt '-1 hour' \
            -exec sh -c 'echo "== $1"; tail -200 "$1"' _ {} \; 2>/dev/null || true
      - name: Propagate harness failures to the job result
        if: always()
        env:
          RUST_HARNESS: ${{ steps.rust_harness.outcome }}
          PYTHON_HARNESS: ${{ steps.python_harness.outcome }}
        run: |
          printf 'rust=%s python=%s\n' "$RUST_HARNESS" "$PYTHON_HARNESS"
          test "$RUST_HARNESS" = success
          test "$PYTHON_HARNESS" = success

  # Provider-specific sandbox jobs stay advisory until the capability inventory moves them from
  # experimental to validated. A green advisory check must not silently upgrade a support claim.
  srt-smoke:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Install bubblewrap + socat and allow unprivileged user namespaces (Ubuntu 24.04)
        run: |
          # `apt-get update` is allowed to fail: the runner image carries third-party repos
          # (Google Chrome, Microsoft) that this project does not use and that break on their own
          # schedule -- one returned a Hash Sum mismatch and, because the line was
          # `update && install`, the install never ran. The step still reported SUCCESS, because
          # its last command was the `|| true` sysctl below, and the real failure surfaced three
          # steps later as "sandbox dependencies not available". A mandatory step that passes
          # while doing nothing is the failure #2048 is about.
          sudo apt-get update || echo "::warning::apt-get update failed; installing from the cached index"
          sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Verify rather than assume. This is what the demo needs; if it is not here, say so now
          # and name it, instead of failing later inside a sandbox error message.
          missing=""
          for tool in bwrap socat rg; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::srt cannot run without:$missing"
            exit 1
          fi
          echo "sandbox dependencies present: $(bwrap --version), socat, $(rg --version | head -1)"
      - name: Install Anthropic Sandbox Runtime
        run: npm i -g @anthropic-ai/sandbox-runtime@0.0.75 && srt --version
      - run: uv sync
      - name: demo under srt (scripted agent, kernel-enforced write confinement)
        run: uv run swfactory demo --sandbox srt

  docker-smoke:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: docker build -t swfactory-sandbox:local -f deploy/docker/sandbox.Dockerfile .
      - run: SWF_DOCKER_IMAGE=swfactory-sandbox:local uv run swfactory demo --sandbox docker

  airflow-main:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm install --global pnpm@10.28.1
      - run: scripts/airflow_main.sh
      - run: uv run --no-sync pytest
      - run: uv run --no-sync swfactory demo
      - name: Live scheduler, mapped jobs and authenticated approval gates
        env:
          SWF_AIRFLOW_NO_SYNC: "1"
          SWF_STRESS_SETTLE_POLLS: "4"
        run: scripts/stress_airflow.sh

  airflow-main-sandbox-toolset:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm install --global pnpm@10.28.1
      - run: scripts/airflow_main.sh --islo
      - run: uv run --no-sync pytest tests/test_sandbox_argv.py tests/test_dag_parity.py

  rust:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Release build (the binary release.yml ships; --locked keeps Cargo.lock authoritative)
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

  contract-equivalence:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: uv sync
      - run: uv run pytest tests/test_contract_fixtures.py
      - run: cargo test --manifest-path rust/Cargo.toml -p swf-domain --test contract

  # One blocking fan-in check for the supported release surface. It records the PR head, base and
  # tested checkout (GitHub's PR merge candidate) together with a digest of every required job's
  # result. If HEAD changes, concurrency cancels this run and a new manifest must be produced.
  candidate-readiness:
    if: always() && (github.event_name == 'push' || github.base_ref == 'main')
    needs: [test, eval-suite, airflow-parity, airflow-main, rust, contract-equivalence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      TESTED_SHA: ${{ github.sha }}
      TEST_RESULT: ${{ needs.test.result }}
      EVAL_RESULT: ${{ needs.eval-suite.result }}
      AIRFLOW_PARITY_RESULT: ${{ needs.airflow-parity.result }}
      AIRFLOW_MAIN_RESULT: ${{ needs.airflow-main.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      CONTRACT_RESULT: ${{ needs.contract-equivalence.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - name: Materialize exact-candidate check evidence
        run: |
          set -euo pipefail
          mkdir -p .factory/candidate-evidence
          record() {
            name="$1"; result="$2"
            printf 'check=%s\nresult=%s\nhead=%s\nbase=%s\ntested=%s\n' \
              "$name" "$result" "$HEAD_SHA" "$BASE_SHA" "$TESTED_SHA" \
              > ".factory/candidate-evidence/${name}.txt"
            test "$result" = success
          }
          record test "$TEST_RESULT"
          record eval-suite "$EVAL_RESULT"
          record airflow-parity "$AIRFLOW_PARITY_RESULT"
          record airflow-main "$AIRFLOW_MAIN_RESULT"
          record rust "$RUST_RESULT"
          record contract-equivalence "$CONTRACT_RESULT"
      - name: Seal candidate evidence to exact head/base/tested identity
        run: >-
          uv run python -m swfactory.candidate_readiness
          --head-sha "$HEAD_SHA"
          --base-sha "$BASE_SHA"
          --tested-sha "$TESTED_SHA"
          --required test=.factory/candidate-evidence/test.txt
          --required eval-suite=.factory/candidate-evidence/eval-suite.txt
          --required airflow-parity=.factory/candidate-evidence/airflow-parity.txt
          --required airflow-main=.factory/candidate-evidence/airflow-main.txt
          --required rust=.factory/candidate-evidence/rust.txt
          --required contract-equivalence=.factory/candidate-evidence/contract-equivalence.txt
          --out .factory/candidate-readiness.json
      - name: Upload exact-candidate readiness manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-readiness-${{ github.event.pull_request.number || github.run_number }}
          path: |
            .factory/candidate-readiness.json
            .factory/candidate-evidence/*.txt
          if-no-files-found: error
