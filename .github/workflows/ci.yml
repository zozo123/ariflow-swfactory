name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - name: Reject unresolved documentation template tokens
        run: '! grep -R -n -E "FILTERS_[A-Z]+|EXAMPLES_BLOCK|DRYRUN_PARA" docs'
      - run: uv run pytest
      - run: uv run python -m swfactory.liquid_release
      - name: e2e demo (scripted agent, local runner, local git remote)
        run: uv run swfactory demo

  # Expensive integration gates run only for main fan-in PRs and main pushes. Internal liquid
  # fan-out PRs get the fast Python gate above, which keeps 10-50 issue bundles cheap to iterate.
  airflow-parity:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --group airflow
      - run: >-
          uv run --group airflow pytest
          tests/test_dag_parity.py tests/test_dag_smoke.py tests/test_dag_stress.py

  # The only job that answers a REAL approval gate against a REAL scheduler. Every other job
  # proves a piece works; `dag.test()` cannot resolve HITL tasks at all (tests/test_dag_smoke.py
  # marks them success with `--mark-success-pattern`), so the product's central behaviour was
  # untested until this existed. It is not hypothetical: a race in `swf gates approve` failed four
  # of five of these runs while all eight CI jobs stayed green (#1199, fixed in #1198).
  #
  # Both harnesses always run. Their checkouts carry no persisted GitHub credential, and a failure
  # in one harness cannot suppress the other. The final step reconstructs a red job from either
  # failed outcome; this job is a blocking main-fan-in gate.
  live-gate-e2e:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `swf` reads pull requests through `gh`, which refuses to run in Actions without a token and
    # would otherwise degrade the delivery half of the run into "source github is unavailable".
    env:
      GH_TOKEN: ${{ github.token }}
      # The gate settle window, widened for this runner without rebuilding the binary. `swf`
      # defaults to 5 s, measured against a laptop's scheduler; a two-core runner reconciles a
      # parked worker more slowly AND ripens gates faster (36 s here against ~110 s on a laptop),
      # and answering inside that reconciliation fails the gate. The knob exists because the
      # previous fix was a compiled-in 3 s that went nine local runs green and failed here on the
      # first try, with no way to raise it short of shipping a new binary. Lower it back toward
      # the default if this job stays green for a month; raise it if it does not.
      SWF_GATE_SETTLE_SECS: "8"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: uv sync --group airflow
      - name: swf drives backend + live Airflow end to end (2 issues x 2 targets, 8 gates, 4 deliveries)
        id: rust_harness
        continue-on-error: true
        run: bash scripts/swf_e2e.sh --backend
      - name: the Python control room answers the same gates on the same shape of run
        id: python_harness
        if: always()
        continue-on-error: true
        run: bash scripts/stress_airflow.sh
      - name: Keep scheduler evidence when either harness fails
        if: >-
          always() &&
          (steps.rust_harness.outcome != 'success' || steps.python_harness.outcome != 'success')
        run: |
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name 'standalone.log' -newermt '-1 hour' \
            -exec sh -c 'echo "== $1"; tail -200 "$1"' _ {} \; 2>/dev/null || true
      - name: Propagate harness failures to the job result
        if: always()
        env:
          RUST_HARNESS: ${{ steps.rust_harness.outcome }}
          PYTHON_HARNESS: ${{ steps.python_harness.outcome }}
        run: |
          printf 'rust=%s python=%s\n' "$RUST_HARNESS" "$PYTHON_HARNESS"
          test "$RUST_HARNESS" = success
          test "$PYTHON_HARNESS" = success

  srt-smoke:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Install bubblewrap + socat and allow unprivileged user namespaces (Ubuntu 24.04)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Anthropic Sandbox Runtime
        run: npm i -g @anthropic-ai/sandbox-runtime@0.0.75 && srt --version
      - run: uv sync
      - name: demo under srt (scripted agent, kernel-enforced write confinement)
        run: uv run swfactory demo --sandbox srt

  docker-smoke:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync
      - run: docker build -t swfactory-sandbox:local -f deploy/docker/sandbox.Dockerfile .
      - run: SWF_DOCKER_IMAGE=swfactory-sandbox:local uv run swfactory demo --sandbox docker

  airflow-main:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm install --global pnpm@10.28.1
      - run: scripts/airflow_main.sh
      - run: uv run --no-sync pytest
      - run: uv run --no-sync swfactory demo
      - name: Live scheduler, mapped jobs and authenticated approval gates
        env:
          SWF_AIRFLOW_NO_SYNC: "1"
        run: scripts/stress_airflow.sh

  airflow-main-sandbox-toolset:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm install --global pnpm@10.28.1
      - run: scripts/airflow_main.sh --islo
      - run: uv run --no-sync pytest tests/test_sandbox_argv.py tests/test_dag_parity.py

  rust:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Release build (the binary release.yml ships; --locked keeps Cargo.lock authoritative)
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

  contract-equivalence:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: uv sync
      - run: uv run pytest tests/test_contract_fixtures.py
      - run: cargo test --manifest-path rust/Cargo.toml -p swf-domain --test contract