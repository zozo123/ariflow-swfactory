name: evals
# Runs the optional provider suite weekly and on
# demand (workflow_dispatch). ci.yml runs the required scripted evals for every main candidate.
# This workflow retains a scripted baseline for comparison with its optional provider jobs:
#   eval-suite  demo/evals/**: the whole suite with the SCRIPTED agent in a local sandbox, gated
#               on demo/evals/baseline.json. No secret and no duplicate per-PR/push run.
# The two below run the REAL path on demo/issue.md, with the same assertion on the RunReport the
# CLI writes to .factory/<run>/report.json (tests passed, deliver:ok); local scm, so the PR is
# printed, not opened:
#   real-demo   claude agent confined by the Anthropic Sandbox Runtime (bubblewrap, ubuntu-24.04);
#               needs the ANTHROPIC_API_KEY secret.
#   evals-islo  the production path: claude agent in an islo MicroVM behind the deny-by-default
#               `swfactory` gateway, Anthropic key reaches the VM only as a phantom token; the runner
#               is the orchestrator and holds ISLO_API_KEY only. Needs the ISLO_API_KEY secret.
# Each KEYED job is skipped (reported as skipped, not as passed) with a notice when its secret is
# absent (forks), never failing for lack of a key; eval-suite always runs. Optional repo variable
# SWF_ISLO_SNAPSHOT warm-starts the MicroVM (docs/islo.md snapshot).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
jobs:
  # The gate the playbook asks for: a config change that drops the pass rate is caught here,
  # before review. Keyless by construction — the scripted agent replays demo/evals/*/ fixtures,
  # so nothing calls a model and nothing leaves the runner.
  eval-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ""   # proves the suite needs no key: overrides the workflow-level value
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Install swfactory
        run: uv sync
      - name: Run the eval suite (scripted agent, local sandbox) and gate on the baseline
        run: uv run python -m swfactory.evals --suite demo/evals
      - name: Upload eval run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-suite-runs
          path: |
            .factory/evals/*/*/run/report.json
            .factory/evals/*/*/run/pr.md
            .factory/evals/*/*/run/stages.jsonl
          if-no-files-found: ignore

  # A job-level `if:` cannot read `secrets`, so the keys are checked here and a keyed job without
  # its key is SKIPPED -- never reported as a green run that ran nothing.
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
    outputs:
      anthropic: ${{ steps.check.outputs.anthropic }}
      islo: ${{ steps.check.outputs.islo }}
    steps:
      - name: Check for ANTHROPIC_API_KEY and ISLO_API_KEY
        id: check
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "anthropic=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ANTHROPIC_API_KEY secret not set; skipping real-demo"; fi
          if [ -n "$ISLO_API_KEY" ]; then echo "islo=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ISLO_API_KEY secret not set; skipping evals-islo"; fi

  real-demo:
    needs: keys
    if: needs.keys.outputs.anthropic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Install bubblewrap + socat and allow unprivileged user namespaces (Ubuntu 24.04)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Anthropic Sandbox Runtime and Claude Code
        run: |
          npm i -g @anthropic-ai/sandbox-runtime@0.0.75 @anthropic-ai/claude-code
          srt --version && claude --version
      - name: Install swfactory
        run: uv sync
      - name: Real factory run on demo/issue.md (claude agent under srt, local git remote)
        env:
          # The demo blueprint declares both gates `mode = "human"`. #2066 stopped SWF_APPROVE=auto
          # from converting a declared human gate into an automatic one, so an unattended run has
          # to answer them explicitly. The fixture is permitted here because `--scm local` publishes
          # to a temporary local remote: nothing leaves the runner and no credential is used.
          SWF_GATE_REPLAY: demo/gate-replay.json
        run: |
          uv run swfactory run --issue demo/issue.md --agent claude --sandbox srt --scm local
      - name: Assert tests passed and deliver succeeded
        run: |
          set -euo pipefail
          report=$(find .factory -maxdepth 2 -name report.json | head -1 || true)
          if [ -z "$report" ]; then echo "no .factory/*/report.json produced"; exit 1; fi
          uv run python - "$report" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(json.dumps(r, indent=2))
          stages = {s["stage"]: s["status"] for s in r["stages"]}
          assert r["tests_passed"] is True, "tests did not pass"
          assert stages.get("deliver") == "ok", f"deliver status: {stages.get('deliver')!r}"
          PY
      - name: Upload artifact chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-artifacts
          path: |
            .factory/*/report.json
            .factory/*/pr.md
            .factory/**/docs/factory/**
          if-no-files-found: ignore

  evals-islo:
    needs: keys
    if: needs.keys.outputs.islo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
      # The orchestrator never holds an Anthropic key: the sandbox gets a phantom one from the
      # `swfactory` environment (--gateway-secret). Override the workflow-level value with "".
      ANTHROPIC_API_KEY: ""
      SWF_ISLO_SNAPSHOT: ${{ vars.SWF_ISLO_SNAPSHOT }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - name: Install islo CLI
        run: |
          curl -fsSL https://islo.dev/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          islo --version
      - name: Install swfactory
        run: uv sync
      - name: Preflight (islo auth + tool integrations, gateway profile, environment, snapshot)
        run: uv run swfactory doctor --agent claude --sandbox islo --scm local --json
      - name: Real factory run on demo/issue.md (claude agent in an islo MicroVM, local git remote)
        env:
          # The demo blueprint declares both gates `mode = "human"`. #2066 stopped SWF_APPROVE=auto
          # from converting a declared human gate into an automatic one, so an unattended run has
          # to answer them explicitly. The fixture is permitted here because `--scm local` publishes
          # to a temporary local remote: nothing leaves the runner and no credential is used.
          SWF_GATE_REPLAY: demo/gate-replay.json
        run: |
          uv run swfactory run --issue demo/issue.md --agent claude --sandbox islo --scm local
      - name: Assert tests passed and deliver succeeded
        run: |
          set -euo pipefail
          report=$(find .factory -maxdepth 2 -name report.json | head -1 || true)
          if [ -z "$report" ]; then echo "no .factory/*/report.json produced"; exit 1; fi
          uv run python - "$report" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(json.dumps(r, indent=2))
          stages = {s["stage"]: s["status"] for s in r["stages"]}
          assert r["sandbox"].startswith("swf-"), f"not an islo sandbox: {r['sandbox']!r}"
          assert r["tests_passed"] is True, "tests did not pass"
          assert stages.get("deliver") == "ok", f"deliver status: {stages.get('deliver')!r}"
          PY
      - name: Upload artifact chain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-artifacts-islo
          path: |
            .factory/*/report.json
            .factory/*/pr.md
            .factory/*/stages.jsonl
          if-no-files-found: ignore
