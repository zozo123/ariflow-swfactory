name: evals
# Runs the REAL path (claude agent confined by the Anthropic Sandbox Runtime, bubblewrap on
# ubuntu-24.04) on the demo issue whenever the factory's institutional knowledge changes, and
# weekly. Local scm: the PR is printed, not opened. Asserts on the RunReport the CLI writes to
# .factory/<run>/report.json (tests passed, deliver:ok). Needs the ANTHROPIC_API_KEY secret; the
# job is skipped with a notice when it is absent (forks), so it never fails for lack of a key.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CLAUDE.md
      - REVIEW.md
      - bands.yaml
      - .claude/**
      - blueprints/**
      - src/swfactory/prompts/**
      - src/swfactory/agent.py
      - src/swfactory/stages.py
      - .github/workflows/evals.yml
  pull_request:
    paths:
      - CLAUDE.md
      - REVIEW.md
      - bands.yaml
      - .claude/**
      - blueprints/**
      - src/swfactory/prompts/**
      - src/swfactory/agent.py
      - src/swfactory/stages.py
      - .github/workflows/evals.yml
permissions:
  contents: read
env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
jobs:
  real-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set; skipping evals"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.enabled == 'true'
        with: { python-version: "3.12" }
      - name: Install bubblewrap + socat and allow unprivileged user namespaces (Ubuntu 24.04)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Anthropic Sandbox Runtime and Claude Code
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npm i -g @anthropic-ai/sandbox-runtime@0.0.75 @anthropic-ai/claude-code
          srt --version && claude --version
      - name: Install swfactory
        if: steps.gate.outputs.enabled == 'true'
        run: uv sync
      - name: Real factory run on demo/issue.md (claude agent under srt, local git remote)
        if: steps.gate.outputs.enabled == 'true'
        env:
          SWF_APPROVE: auto
        run: |
          uv run swfactory run --issue demo/issue.md --agent claude --sandbox srt --scm local --approve auto
      - name: Assert tests passed and deliver succeeded
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          report=$(find .factory -maxdepth 2 -name report.json | head -1 || true)
          if [ -z "$report" ]; then echo "no .factory/*/report.json produced"; exit 1; fi
          uv run python - "$report" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(json.dumps(r, indent=2))
          stages = {s["stage"]: s["status"] for s in r["stages"]}
          assert r["tests_passed"] is True, "tests did not pass"
          assert stages.get("deliver") == "ok", f"deliver status: {stages.get('deliver')!r}"
          PY
      - name: Upload artifact chain
        if: steps.gate.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-artifacts
          path: |
            .factory/*/report.json
            .factory/*/pr.md
            .factory/**/docs/factory/**
          if-no-files-found: ignore
