name: live-gate-settle-patch
on:
  push:
    branches: [ci/live-gate-e2e]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'apply hosted gate settle fix')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/live-gate-e2e
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/apply_live_gate_settle_fix.py
      - name: Commit patched gate implementation
        run: |
          if git diff --quiet; then
            echo 'no patch changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/swf-app/src/gates.rs
          git commit -m 'apply hosted gate settle fix'
          git push origin HEAD:ci/live-gate-e2e
