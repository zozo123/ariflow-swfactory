name: hardening-format-once

on:
  push:
    paths: [.github/workflows/hardening-format-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Apply Ruff fixes and canonical formatting
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          git diff --check
      - name: Commit only when Ruff changed files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply canonical Ruff fixes'
          git push origin HEAD:${GITHUB_REF_NAME}
