name: close-backlog-v1

# Historical compatibility entrypoint. Blanket backlog mutation is intentionally disabled: a
# release may close only the exact issue identities named by a checked-in manifest. This keeps a
# later issue from being swept into an older release merely because it happened to be open.
on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Checked-in explicit release issue manifest
        required: true
        type: string
      apply:
        description: Close only the manifest-declared issues after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  manifest-scoped-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Explain closure authority
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Blanket issue closure is disabled.
          This compatibility workflow delegates to the checked-in explicit release manifest.
          EOF

      - name: Validate explicit release issue manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/close_release_issues.py "${{ inputs.manifest_path }}"

      - name: Close only manifest-declared issues
        if: inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/close_release_issues.py "${{ inputs.manifest_path }}" --apply
