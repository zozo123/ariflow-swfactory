name: finalize-operator-docs-once

on:
  push:
    branches: [finish/operator-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: finish/operator-runtime
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/finalize_operator_docs_once.py
      - name: Commit generated docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- docs/swf.md; then
            git add docs/swf.md
            git commit -m "docs: replace operator guide placeholders with executable examples"
            git push
          fi
