name: finalize-operator-docs-once

on:
  push:
    branches: [finish/operator-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: finish/operator-runtime
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/finalize_operator_docs_once.py
      - run: python tools/finalize_stage_registry_once.py
      - name: Commit generated convergence edits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- docs/swf.md dags/blueprints.py; then
            git add docs/swf.md dags/blueprints.py
            git commit -m "refactor: finalize operator docs and shared stage registry"
            git push
          fi
