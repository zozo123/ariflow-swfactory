name: liquid-format

on:
  push:
    branches:
      - stabilize/liquid-final

permissions:
  contents: write

concurrency:
  group: liquid-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'chore: apply automated formatting') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilize/liquid-final
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: uv sync
      - name: Normalize Python
        run: |
          uv run ruff check . --fix
          uv run ruff format .
      - name: Normalize Rust
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit normalization
        run: |
          if git diff --quiet; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name 'swfactory-stabilizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply automated formatting'
          git push origin HEAD:stabilize/liquid-final
