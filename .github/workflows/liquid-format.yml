name: liquid-format

on:
  push:
    branches:
      - stabilize/liquid-final

permissions:
  contents: write

concurrency:
  group: liquid-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilize/liquid-final
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: uv sync
      - name: Apply stabilization rewrites
        run: uv run python scripts/stabilize_liquid_fanin.py
      - name: Normalize Python
        run: |
          # Keep safe autofixes even when Ruff reports residual rules that need a human decision.
          uv run ruff check . --fix || true
          uv run ruff format .
      - name: Normalize Rust
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit normalization
        run: |
          if git diff --quiet; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name 'swfactory-stabilizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: stabilize fan-in contracts and formatting'
          git push origin HEAD:stabilize/liquid-final
