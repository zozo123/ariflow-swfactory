name: harness-rustfmt
on:
  push:
    branches: [harness/foundation]
permissions:
  contents: write
jobs:
  fmt:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'rustfmt harness foundation')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harness/foundation
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit rustfmt
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/
          git commit -m 'rustfmt harness foundation'
          git push origin HEAD:harness/foundation
