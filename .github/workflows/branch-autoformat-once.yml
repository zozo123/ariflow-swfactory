name: branch-autoformat-once

on:
  push:
    branches:
      - feat/liquid-adaptive-information-budget

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/liquid-adaptive-information-budget
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Apply canonical Ruff formatting
        run: uv run ruff format .
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:feat/liquid-adaptive-information-budget
