name: promotion-policy
# Development checks are offline and need no administrator credential.
# Live repository settings are audited separately by the manual live-policy-audit workflow.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked

      - name: The policy agrees with the workflows it governs
        run: uv run python scripts/promotion_policy.py audit
