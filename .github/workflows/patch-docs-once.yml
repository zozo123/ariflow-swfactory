name: patch-docs-once

on:
  push:
    branches: [hardening/docs-correctness]
    paths:
      - scripts/patch_docs_issues.py
      - .github/workflows/patch-docs-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/docs-correctness
      - uses: astral-sh/setup-uv@v6
      - name: Apply exact docs corrections
        run: uv run python scripts/patch_docs_issues.py
      - name: Refuse unresolved template placeholders
        run: |
          ! grep -R -n -E 'FILTERS_GATES|FILTERS_JOBS|FILTERS_RUNS|EXAMPLES_BLOCK|DRYRUN_PARA' docs/swf.md
      - name: Commit corrected docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/factory-backend.md docs/swf.md CLAUDE.md
          git diff --cached --check
          git commit -m 'docs: correct backend and swf contracts'
          git push origin HEAD:hardening/docs-correctness
