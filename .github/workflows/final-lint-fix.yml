name: final-lint-fix

on:
  push:
    branches:
      - stabilize/liquid-final
    paths:
      - scripts/apply_final_lint_fixes.py
      - .github/workflows/final-lint-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-lint-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilize/liquid-final
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: uv sync
      - name: Apply deterministic repairs
        run: uv run python scripts/apply_final_lint_fixes.py
      - name: Normalize Python
        run: |
          uv run ruff check . --fix || true
          uv run ruff format .
      - name: Normalize Rust
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo 'already clean'
            exit 0
          fi
          git config user.name 'swfactory-stabilizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clear final stabilization lint gates'
          git push origin HEAD:stabilize/liquid-final
