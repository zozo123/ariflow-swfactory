name: final-hardening-patch-once

on:
  push:
    branches: [hardening/final-open-issues]
    paths: [.github/workflows/final-hardening-patch-once.yml]

permissions:
  contents: write

jobs:
  patch-format-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/final-open-issues
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "rust" }
      - run: uv sync
      - name: Apply final hardening patch
        run: uv run python scripts/final_hardening_patch_once.py
      - name: Normalize generated source/tests and remove patcher
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/swfactory/backend/service.py")
          text = path.read_text()
          old = 'else "export SWF_BACKEND_URL and the same SWF_BACKEND_TOKEN before starting Airflow scheduler/workers"'
          new = '''else (
                              "export SWF_BACKEND_URL and the same SWF_BACKEND_TOKEN "
                              "before starting Airflow scheduler/workers"
                          )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one callback doctor fix string, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/test_backend_service_contract.py")
          test_text = test_path.read_text()
          test_old = '    monkeypatch.setenv("AIRFLOW_TOKEN", "airflow-test-token")\n'
          test_new = test_old + '    monkeypatch.setenv("SWF_BACKEND_TOKEN", TOKEN)\n'
          if test_text.count(test_old) != 1:
              raise SystemExit(f"expected one backend test env anchor, found {test_text.count(test_old)}")
          test_path.write_text(test_text.replace(test_old, test_new, 1))
          PY
          rm scripts/final_hardening_patch_once.py
      - name: Canonical formatting
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Targeted Python checks
        run: >-
          uv run pytest
          tests/test_backend_runtime_contract.py
          tests/test_backend_service_contract.py
          tests/test_harness_scale_scenarios.py
      - name: Targeted Rust backend adapter checks
        run: cargo test --manifest-path rust/Cargo.toml -p swf-adapters --test factory
      - name: Docs template guard
        run: '! grep -R -n -E "FILTERS_[A-Z]+|EXAMPLES_BLOCK|DRYRUN_PARA" docs'
      - name: Push verified non-workflow product diff
        run: |
          # The Actions token can push ordinary repository files but GitHub intentionally refuses
          # workflow-file mutations without workflows permission. Revert only workflow paths here;
          # the authenticated connector lands those exact deltas after this verified commit.
          git checkout -- .github/workflows/ci.yml
          git checkout -- .github/workflows/final-hardening-patch-once.yml
          git checkout -- .github/workflows/hardening-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finish backend hardening and operator docs'
          git push origin HEAD:hardening/final-open-issues
