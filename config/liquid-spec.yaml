    slug: self-improvement
    family: Liquid500
    bundle: liquid500-09
    owner: authority
    state: declared
    support: unsupported
    invariant: "A self-change follows the same gates as any other change; the factory gets no privileged path into itself."
    runtime_anchor: swfactory.generations
    evidence_requirement: "The candidate-readiness manifest for the self-change, identical in shape to any other candidate's."
  - id: liquid500.planner-quality
    slug: planner-quality
    family: Liquid500
    bundle: liquid500-09
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "A plan is rejected when it is unexecutable (missing files, cyclic dependencies) rather than partially executed."
    runtime_anchor: swfactory.parallel_workers
    evidence_requirement: "A rejected-plan record naming the structural defect, plus the eval score for accepted plans."
  - id: liquid500.agent-evaluation
    slug: agent-evaluation
    family: Liquid500
    bundle: liquid500-09
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Agent capability is claimed only from recorded eval runs on a pinned suite."
    runtime_anchor: swfactory.evals
    evidence_requirement: "Eval run evidence for the pinned suite on the tested commit."
  - id: liquid500.local-demo
    slug: local-demo
    family: Liquid500
    bundle: liquid500-09
    owner: operator
    state: declared
    support: unsupported
    invariant: "The demo path exercises the real control plane with a scripted agent and a local remote, with nothing stubbed in the kernel."
    runtime_anchor: swfactory.runtime
    evidence_requirement: "A green demo run in CI using the local runner and local git remote."
  - id: liquid500.docs-dx
    slug: docs-dx
    family: Liquid500
    bundle: liquid500-10
    owner: operator
    state: declared
    support: unsupported
    invariant: "Documented behaviour matches runtime behaviour; a doc claim without a runtime anchor is a defect."
    runtime_anchor: swfactory.inspection
    evidence_requirement: "A docs-to-anchor check resolving every documented capability to a runtime path."
  - id: liquid500.test-architecture
    slug: test-architecture
    family: Liquid500
    bundle: liquid500-10
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Tests are hermetic and deterministic; a test that needs the network is a defect, not a flake."
    runtime_anchor: swfactory.ci_topology
    evidence_requirement: "A test run with the network unavailable, plus repeated runs showing no order dependence."
  - id: liquid500.fuzz-property
    slug: fuzz-property
    family: Liquid500
    bundle: liquid500-10
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Contract and journal invariants hold under randomised input, not only on curated cases."
    runtime_anchor: swfactory.evals
    evidence_requirement: "A property/fuzz run artefact with the seed corpus and any shrunk counterexample."
  - id: liquid500.architecture-health
    slug: architecture-health
    family: Liquid500
    bundle: liquid500-10
    owner: authority
    state: declared
    support: unsupported
    invariant: "More issue slices must not add permanent abstractions; superseded paths are deleted, not parked."
    runtime_anchor: swfactory.authority
    evidence_requirement: "A module and dependency census showing the count fell or held while coverage rose."
  - id: liquid500.stabilization-readiness
    slug: stabilization-readiness
    family: Liquid500
    bundle: liquid500-10
    owner: operator
    state: declared
    support: unsupported
    invariant: "A slice is done only when its evidence is sealed and its superseded path is gone."
    runtime_anchor: swfactory.trust_evidence
    evidence_requirement: "A stabilization record listing the sealed evidence and the deleted superseded path."
  - id: liquid400.authority-transfer
    slug: authority-transfer
    family: Liquid400
    bundle: liquid400-01
    owner: authority
    state: declared
    support: unsupported
    invariant: "Authority moves by epoch increment; the old holder is fenced out before the new one acts."
    runtime_anchor: swfactory.authority
    evidence_requirement: "A transfer trace showing the old epoch fenced before the new epoch's first write."
  - id: liquid400.epoch-fencing
    slug: epoch-fencing
    family: Liquid400
    bundle: liquid400-01
    owner: airflow
    state: declared
    support: unsupported
    invariant: "A write carrying an epoch lower than the Cell's current epoch is refused, always."
    runtime_anchor: swfactory.cells:StaleEpoch
    evidence_requirement: "A fencing test with a stale-epoch write refused and the refusal journalled."
  - id: liquid400.airflow-recovery
    slug: airflow-recovery
    family: Liquid400
    bundle: liquid400-01
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "A scheduler restart resumes managed runs from durable state without duplicating external effects."
    runtime_anchor: swfactory.airflow_binding
    evidence_requirement: "A restart drill showing resumed runs and no duplicate journal effects."
  - id: liquid400.mapped-task-cancel
    slug: mapped-task-cancel
    family: Liquid400
    bundle: liquid400-01
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Cancellation is durable and wins: a cancelled run stops issuing effects within a bounded lag."
    runtime_anchor: swfactory.lifecycle
    evidence_requirement: "Measured cancellation lag from request to last effect, with no effect after the stop."
  - id: liquid400.approval-durability
    slug: approval-durability
    family: Liquid400
    bundle: liquid400-01
    owner: security
    state: declared
    support: unsupported
    invariant: "An approval survives restart and stays bound to the epoch and artefact it approved."
    runtime_anchor: swfactory.lifecycle_evidence
    evidence_requirement: "A restart test showing the approval intact and still epoch-bound."
  - id: liquid400.sandbox-provision
    slug: sandbox-provision
    family: Liquid400
    bundle: liquid400-02
    owner: evidence
    state: declared
    support: unsupported
    invariant: "A sandbox is provisioned with a declared toolset and no ambient credentials."
    runtime_anchor: swfactory.sandbox
    evidence_requirement: "A provisioning record listing the toolset and an environment scan showing no ambient secret."
  - id: liquid400.sandbox-reclaim
    slug: sandbox-reclaim
    family: Liquid400
    bundle: liquid400-02
    owner: operator
    state: declared
    support: unsupported
    invariant: "Every provisioned sandbox is reclaimed, and the reclamation is receipted even after a crash."
    runtime_anchor: swfactory.cleanup_receipt
    evidence_requirement: "Cleanup receipts matching provisioning records one to one, including a crash case."
  - id: liquid400.provider-drift
    slug: provider-drift
    family: Liquid400
    bundle: liquid400-02
    owner: authority
    state: declared
    support: unsupported
    invariant: "Provider behaviour drift is detected by conformance before it reaches a managed run."
    runtime_anchor: swfactory.provider_conformance
    evidence_requirement: "A conformance diff against the previous recorded provider profile."
  - id: liquid400.operation-replay
    slug: operation-replay
    family: Liquid400
    bundle: liquid400-02
    owner: airflow
    state: declared
    support: unsupported
    invariant: "A replayed operation returns the original recorded result rather than performing the effect twice."
    runtime_anchor: swfactory.idempotency:OperationJournal
    evidence_requirement: "A replay test returning the original result with no second external effect."
  - id: liquid400.mutation-observation
    slug: mutation-observation
    family: Liquid400
    bundle: liquid400-02
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "An effect is declared committed only from remote observation, never from local optimism."
    runtime_anchor: swfactory.idempotency
    evidence_requirement: "An observation record naming the remote marker that proved the effect."
  - id: liquid400.cleanup-debt
    slug: cleanup-debt
    family: Liquid400
    bundle: liquid400-03
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Cleanup debt is measured and drained; unreclaimed resources are visible, not forgotten."
    runtime_anchor: swfactory.cleanup_receipt
    evidence_requirement: "A cleanup-debt counter trending to zero with the reclamation receipts."
  - id: liquid400.admission-fairness
    slug: admission-fairness
    family: Liquid400
    bundle: liquid400-03
    owner: security
    state: declared
    support: unsupported
    invariant: "Under load no admitted tenant or repository is starved beyond a declared bound."
    runtime_anchor: swfactory.durable_admission
    evidence_requirement: "Per-tenant admission shares from a saturation run against the declared bound."
  - id: liquid400.queue-starvation
    slug: queue-starvation
    family: Liquid400
    bundle: liquid400-03
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Queue depth is bounded and observable; a growing queue throttles intake."
    runtime_anchor: swfactory.durable_admission
    evidence_requirement: "Queue-depth timeseries from a saturation run showing intake throttled."
  - id: liquid400.repo-races
    slug: repo-races
    family: Liquid400
    bundle: liquid400-03
    owner: operator
    state: declared
    support: unsupported
    invariant: "Two runs touching the same branch cannot both believe they won."
    runtime_anchor: swfactory.repo_coordination
    evidence_requirement: "A race trace showing one write accepted and the other refused, both journalled."
  - id: liquid400.git-publication
    slug: git-publication
    family: Liquid400
    bundle: liquid400-03
    owner: authority
    state: declared
    support: unsupported
    invariant: "A git publication is atomic from the caller's view: it either lands once or is provably absent."
    runtime_anchor: swfactory.backend_scm
    evidence_requirement: "A publication journal row plus remote observation proving landed-once or absent."
  - id: liquid400.webhook-replay
    slug: webhook-replay
    family: Liquid400
    bundle: liquid400-04
    owner: airflow
    state: declared
    support: unsupported
    invariant: "A replayed webhook is recognised as a replay and produces no new effect."
    runtime_anchor: swfactory.webhook
    evidence_requirement: "A replay test showing the delivery recognised and no second effect journalled."
  - id: liquid400.intake-dedupe
    slug: intake-dedupe
    family: Liquid400
    bundle: liquid400-04
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "Two intakes for the same issue identity collapse to one run, whichever arrives first."
    runtime_anchor: swfactory.intake_policy
    evidence_requirement: "A concurrent double-intake test producing exactly one run."
  - id: liquid400.workspace-isolation
    slug: workspace-isolation
    family: Liquid400
    bundle: liquid400-04
    owner: recovery
    state: declared
    support: unsupported
    invariant: "A run cannot read or write another run's workspace."
    runtime_anchor: swfactory.workspace_materialization
    evidence_requirement: "A cross-workspace access attempt denied by the sandbox boundary."
  - id: liquid400.artifact-integrity
    slug: artifact-integrity
    family: Liquid400
    bundle: liquid400-04
    owner: security
    state: declared
    support: unsupported
    invariant: "An artefact's digest is verified before it is trusted as evidence."
    runtime_anchor: swfactory.provenance
    evidence_requirement: "A verification log plus a rejected tampered-artefact case."
  - id: liquid400.cache-consistency
    slug: cache-consistency
    family: Liquid400
    bundle: liquid400-04
    owner: evidence
    state: declared
    support: unsupported
    invariant: "A stale cache entry is detected and discarded rather than served."
    runtime_anchor: swfactory.state
    evidence_requirement: "A staleness test showing the entry invalidated on the underlying change."
  - id: liquid400.storage-migration
    slug: storage-migration
    family: Liquid400
    bundle: liquid400-05
    owner: operator
    state: declared
    support: unsupported
    invariant: "A store migration is rehearsed on a copy and reversible before it touches the authoritative store."
    runtime_anchor: swfactory.backend_store
    evidence_requirement: "A rehearsal log on a restored copy plus the tested rollback path."
  - id: liquid400.evidence-sealing
    slug: evidence-sealing
    family: Liquid400
    bundle: liquid400-05
    owner: authority
    state: declared
    support: unsupported
    invariant: "Evidence is sealed to an exact head/base/tested identity and cannot be re-pointed afterwards."
    runtime_anchor: swfactory.evidence_store
    evidence_requirement: "A sealed manifest digest that changes when any of head, base or tested SHA changes."
  - id: liquid400.provenance-sbom
    slug: provenance-sbom
    family: Liquid400
    bundle: liquid400-05
    owner: airflow
    state: declared
    support: unsupported
    invariant: "Every published artefact carries provenance identifying the commit, builder and inputs that produced it."
    runtime_anchor: swfactory.provenance
    evidence_requirement: "An SBOM plus signed provenance attestation resolving to the tested commit."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid400.otel-correlation
    slug: otel-correlation
    family: Liquid400
    bundle: liquid400-05
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "A single run is traceable end to end across control plane, scheduler and sandbox by one correlation identity."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "One trace spanning all three layers for a single run id."
  - id: liquid400.slo-budget
    slug: slo-budget
    family: Liquid400
    bundle: liquid400-05
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Error budget is computed from recorded counters and gates promotion when exhausted."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "A budget computation from recorded counters plus a promotion blocked on exhaustion."
  - id: liquid400.cost-attribution
    slug: cost-attribution
    family: Liquid400
    bundle: liquid400-06
    owner: security
    state: declared
    support: unsupported
    invariant: "Cost is attributable per Cell, per run and per provider without manual reconciliation."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "A cost breakdown by cell, run and provider reconciled to the provider total."
  - id: liquid400.secret-scope
    slug: secret-scope
    family: Liquid400
    bundle: liquid400-06
    owner: evidence
    state: declared
    support: unsupported
    invariant: "A secret's scope is the narrowest that completes the operation, and its use is recorded."
    runtime_anchor: swfactory.security_contract
    evidence_requirement: "A grant record per secret use naming the scope and the operation it served."
  - id: liquid400.policy-drift
    slug: policy-drift
    family: Liquid400
    bundle: liquid400-06
    owner: operator
    state: declared
    support: unsupported
    invariant: "Deployed policy matches declared policy; drift blocks writes rather than being tolerated."
    runtime_anchor: swfactory.security_boundary
    evidence_requirement: "A drift check comparing deployed to declared policy, with writes blocked on mismatch."
  - id: liquid400.tenant-isolation
    slug: tenant-isolation
    family: Liquid400
    bundle: liquid400-06
    owner: authority
    state: declared
    support: unsupported
    invariant: "Tenant boundaries hold in storage, sandboxes and evidence, not only in the API layer."
    runtime_anchor: swfactory.worker_security
    evidence_requirement: "An isolation probe across storage, sandbox and evidence surfaces for two tenants."
  - id: liquid400.release-promotion
    slug: release-promotion
    family: Liquid400
    bundle: liquid400-06
    owner: airflow
    state: declared
    support: unsupported
    invariant: "Promotion is a parent-owned decision made against sealed evidence for an exact commit, never against a moving branch."
    runtime_anchor: swfactory.generations
    evidence_requirement: "A promotion record naming head/base/tested SHAs and the evidence digest it accepted."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid400.rollback
    slug: rollback
    family: Liquid400
    bundle: liquid400-07
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "Any promotion can be rolled back to the previously sealed generation without manual surgery."
    runtime_anchor: swfactory.generations
    evidence_requirement: "A rehearsed rollback restoring the prior generation and its evidence pointer."
  - id: liquid400.disaster-recovery
    slug: disaster-recovery
    family: Liquid400
    bundle: liquid400-07
    owner: recovery
    state: declared
    support: unsupported
    invariant: "The factory can be rebuilt from the durable store plus the repository, with no hidden local state."
    runtime_anchor: swfactory.reconcile
    evidence_requirement: "A restore-from-backup drill that reproduces the run inventory and drains in-doubt operations."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid400.cli-contract
    slug: cli-contract
    family: Liquid400
    bundle: liquid400-07
    owner: security
    state: declared
    support: unsupported
    invariant: "The CLI's surface is generated from the same contract the backend serves, so the two cannot drift."
    runtime_anchor: swfactory.cli
    evidence_requirement: "A drift check comparing CLI surface to the served contract."
  - id: liquid400.tui-parity
    slug: tui-parity
    family: Liquid400
    bundle: liquid400-07
    owner: evidence
    state: declared
    support: unsupported
    invariant: "The TUI answers the same questions as the CLI and backend for the same run."
    runtime_anchor: swfactory.product_surface
    evidence_requirement: "A parity capture of the same run across TUI, CLI and backend responses."
  - id: liquid400.backend-versioning
    slug: backend-versioning
    family: Liquid400
    bundle: liquid400-07
    owner: operator
    state: declared
    support: unsupported
    invariant: "A backend version change is additive within a major version and refuses unknown majors."
    runtime_anchor: swfactory.contracts
    evidence_requirement: "Version-negotiation tests across the supported range plus a refusal on an unknown major."
  - id: liquid400.fault-injection
    slug: fault-injection
    family: Liquid400
    bundle: liquid400-08
    owner: authority
    state: declared
    support: unsupported
    invariant: "Injected faults degrade a run into a recorded, recoverable state, never into silent partial success."
    runtime_anchor: swfactory.fault_evidence
    evidence_requirement: "A fault-injection report mapping each injected fault to the recovery path it took."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid400.benchmarks
    slug: benchmarks
    family: Liquid400
    bundle: liquid400-08
    owner: airflow
    state: declared
    support: unsupported
    invariant: "Performance claims come from a recorded benchmark on a named environment, not from estimates."
    runtime_anchor: swfactory.evals
    evidence_requirement: "A benchmark run artefact naming the environment, commit and measured distribution."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid400.fuzzing
    slug: fuzzing
    family: Liquid400
    bundle: liquid400-08
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "Randomised input cannot drive the control plane into an unrecorded state."
    runtime_anchor: swfactory.evals
    evidence_requirement: "A fuzz run with the corpus and journal states reached, all recognised."
  - id: liquid400.factory-generations
    slug: factory-generations
    family: Liquid400
    bundle: liquid400-08
    owner: recovery
    state: experimental
    support: experimental
    invariant: "A child generation is promoted only by its parent, against sealed evidence, and can be rolled back."
    runtime_anchor: swfactory.generations
    evidence_requirement: "A generation manifest plus the parent's promotion decision and a rehearsed rollback."
    capability_claim: factory.generations
    follow_up: "Promote only when a parent-owned promotion and a rehearsed rollback both run in CI."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid400.stabilization-health
    slug: stabilization-health
    family: Liquid400
    bundle: liquid400-08
    owner: security
    state: declared
    support: unsupported
    invariant: "Vocabulary, module count and dead paths trend down while measured coverage trends up."
    runtime_anchor: swfactory.trust_evidence
    evidence_requirement: "A census comparing module count, dead-path count and covered domains across two commits."
