# The 90 domain rows.  `id` is `<family>.<slug>` because six slugs appear in both liquid
# families with DIFFERENT owners; those rows carry a `note` and must be reconciled before
# either is promoted.  `runtime_anchor` is `module` or `module:attribute`, dotted from
# `swfactory`, and the checker fails if it does not resolve.
domains:
  - id: liquid500.cell-authority
    slug: cell-authority
    family: Liquid500
    bundle: liquid500-01
    owner: authority
    state: declared
    support: unsupported
    invariant: "Every managed run is bound to exactly one durable Factory Cell identity, and a write from a stale epoch is refused rather than reordered."
    runtime_anchor: swfactory.cells:CellIdentity
    evidence_requirement: "A journal record showing a stale-epoch write refused while the current epoch's write commits."
  - id: liquid500.airflow-lifecycle
    slug: airflow-lifecycle
    family: Liquid500
    bundle: liquid500-01
    owner: airflow
    state: validated
    support: supported
    invariant: "Apache Airflow is the only lifecycle scheduler; no other component may start, retry or cancel a managed run."
    runtime_anchor: swfactory.airflow_binding:AirflowBinding
    evidence_requirement: "A green airflow-parity check plus a scheduler log proving the run's transitions came only from Airflow."
    capability_claim: airflow.lifecycle
  - id: liquid500.plan-work
    slug: plan-work
    family: Liquid500
    bundle: liquid500-01
    owner: workgraph
    state: validated
    support: supported
    invariant: "Plan.work executes only inside the Airflow-owned build stage, honours declared dependencies and conflicts, and fans in deterministically."
    runtime_anchor: swfactory.parallel_workers:SevenWorkerPool
    evidence_requirement: "A workgraph execution report whose node order satisfies the declared dependency graph on a rerun."
    capability_claim: workgraph.serial
  - id: liquid500.sandbox-lifecycle
    slug: sandbox-lifecycle
    family: Liquid500
    bundle: liquid500-01
    owner: workgraph
    state: validated
    support: test_only
    invariant: "A sandbox is created, used and reclaimed within one Cell epoch, and its reclamation is recorded even when the run fails."
    runtime_anchor: swfactory.sandbox:Sandbox
    evidence_requirement: "A cleanup receipt for every sandbox created during the run, with zero unreclaimed sandboxes at exit."
    capability_claim: sandbox.local-scripted
  - id: liquid500.provider-capabilities
    slug: provider-capabilities
    family: Liquid500
    bundle: liquid500-01
    owner: workgraph
    state: experimental
    support: experimental
    invariant: "A provider is used only through capabilities it has proven in conformance, never through assumed behaviour."
    runtime_anchor: swfactory.provider_conformance:capability_report
    evidence_requirement: "A conformance report per provider, refreshed on the tested commit, listing the capabilities actually exercised."
    capability_claim: workgraph.provider-fork
    follow_up: "Promote only when the fork path has a conformance result for every declared capability on the tested commit."
  - id: liquid500.mutation-journal
    slug: mutation-journal
    family: Liquid500
    bundle: liquid500-02
    owner: recovery
    state: validated
    support: supported
    invariant: "Every external side effect is journalled with its operation identity and intent digest before it is attempted."
    runtime_anchor: swfactory.idempotency:OperationJournal
    evidence_requirement: "A journal row per external effect whose intent digest matches the request that produced it."
    capability_claim: recovery.external-effects
  - id: liquid500.cleanup-reconciliation
    slug: cleanup-reconciliation
    family: Liquid500
    bundle: liquid500-02
    owner: recovery
    state: validated
    support: supported
    invariant: "Ambiguous effects stay in_doubt until observation proves them committed or definitely absent; a stale epoch may not repair them."
    runtime_anchor: swfactory.operation_recovery:plan_recovery
    evidence_requirement: "A reconciliation pass that drains in-doubt operations to committed or absent with the observation that decided each."
    capability_claim: recovery.external-effects
  - id: liquid500.admission-backpressure
    slug: admission-backpressure
    family: Liquid500
    bundle: liquid500-02
    owner: authority
    state: declared
    support: unsupported
    invariant: "Admission is bounded and durable: overload throttles at the gate instead of spawning a second scheduler."
    runtime_anchor: swfactory.durable_admission
    evidence_requirement: "Queue-depth and admission-refusal counters from a saturation run showing bounded concurrency."
  - id: liquid500.github-intake
    slug: github-intake
    family: Liquid500
    bundle: liquid500-02
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Intake is idempotent per issue identity, so a redelivered or replayed intake cannot create a second run."
    runtime_anchor: swfactory.intake_policy
    evidence_requirement: "A replayed intake payload that produces no second run, with the dedupe decision recorded."
  - id: liquid500.github-publication
    slug: github-publication
    family: Liquid500
    bundle: liquid500-02
    owner: recovery
    state: validated
    support: supported
    invariant: "Every managed GitHub write carries the current Cell epoch, policy and operation identity, and is replay-safe."
    runtime_anchor: swfactory.backend_scm:BackendScm
    evidence_requirement: "A publication receipt bound to head/base SHAs plus the journal row proving single-commit semantics."
    capability_claim: mutation.github
  - id: liquid500.repo-coordination
    slug: repo-coordination
    family: Liquid500
    bundle: liquid500-03
    owner: authority
    state: declared
    support: unsupported
    invariant: "Concurrent runs against the same repository serialise on a durable lock rather than racing on the remote."
    runtime_anchor: swfactory.repo_coordination
    evidence_requirement: "A two-run race trace showing one run waiting and neither losing writes."
  - id: liquid500.ci-topology
    slug: ci-topology
    family: Liquid500
    bundle: liquid500-03
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "The required-check set is declared, and a candidate is judged only against checks that actually ran on the tested commit."
    runtime_anchor: swfactory.ci_topology
    evidence_requirement: "The required-check list resolved for the tested SHA alongside each check's conclusion."
  - id: liquid500.workspace-materialization
    slug: workspace-materialization
    family: Liquid500
    bundle: liquid500-03
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "A workspace is materialised from a named commit and is discarded rather than reused across epochs."
    runtime_anchor: swfactory.workspace_materialization
    evidence_requirement: "A materialisation record naming the source commit and the workspace's disposal."
  - id: liquid500.storage-backend
    slug: storage-backend
    family: Liquid500
    bundle: liquid500-03
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Durable state lives in one backend store; no component keeps authoritative state outside it."
    runtime_anchor: swfactory.backend_store
    evidence_requirement: "A restart test proving all authoritative state survived in the backend store alone."
  - id: liquid500.schema-migrations
    slug: schema-migrations
    family: Liquid500
    bundle: liquid500-03
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Schema changes are forward-only and applied before the code that depends on them serves traffic."
    runtime_anchor: swfactory.backend_store
    evidence_requirement: "A migration log showing the applied version and a clean start on the migrated store."
  - id: liquid500.contract-versioning
    slug: contract-versioning
    family: Liquid500
    bundle: liquid500-04
    owner: authority
    state: declared
    support: unsupported
    invariant: "Cross-language and cross-process contracts are versioned, and an unknown version is refused rather than guessed."
    runtime_anchor: swfactory.contracts
    evidence_requirement: "Contract fixture equivalence across implementations plus a refusal on an unknown version."
  - id: liquid500.evidence-ledger
    slug: evidence-ledger
    family: Liquid500
    bundle: liquid500-04
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Every claim a run makes is backed by a retained artefact; an unbacked claim is refused."
    runtime_anchor: swfactory.evidence_store
    evidence_requirement: "A ledger entry per claim, each resolving to a retained artefact digest."
  - id: liquid500.observability-otel
    slug: observability-otel
    family: Liquid500
    bundle: liquid500-04
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Runs emit correlated traces and metrics keyed by Cell identity and epoch."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "A trace for one run whose spans all carry the same cell id and epoch."
  - id: liquid500.slo-alerting
    slug: slo-alerting
    family: Liquid500
    bundle: liquid500-04
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Service objectives are measured from boring counters (queue depth, failure rate, retry rate) and alert before budget exhaustion."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "An alert fired from recorded counters with the burn-rate window that triggered it."
  - id: liquid500.cost-accounting
    slug: cost-accounting
    family: Liquid500
    bundle: liquid500-04
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Every run's cost is attributed to its Cell and is visible before promotion."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "A per-run cost record attributed to a cell id, reconciled against the provider bill."
  - id: liquid500.security-boundaries
    slug: security-boundaries
    family: Liquid500
    bundle: liquid500-05
    owner: security
    state: experimental
    support: experimental
    invariant: "A coding sandbox is confined by the kernel, not by convention, and holds no publication secret."
    runtime_anchor: swfactory.security_boundary
    evidence_requirement: "A confinement test showing an attempted write outside the workspace denied by the sandbox runtime."
    capability_claim: sandbox.srt
    follow_up: "Promote only when kernel-enforced confinement is a required check rather than an opt-in smoke job."
  - id: liquid500.secret-brokerage
    slug: secret-brokerage
    family: Liquid500
    bundle: liquid500-05
    owner: security
    state: declared
    support: unsupported
    invariant: "Secrets are brokered per operation by the backend; agents receive capabilities, never long-lived credentials."
    runtime_anchor: swfactory.security_contract
    evidence_requirement: "A brokerage log showing scoped, short-lived grants and no secret present in the sandbox environment."
  - id: liquid500.policy-engine
    slug: policy-engine
    family: Liquid500
    bundle: liquid500-05
    owner: security
    state: declared
    support: unsupported
    invariant: "Policy is evaluated before the effect and fails closed on evaluation error."
    runtime_anchor: swfactory.security_contract
    evidence_requirement: "A policy decision record per external effect, including a fail-closed refusal case."
  - id: liquid500.multitenancy
    slug: multitenancy
    family: Liquid500
    bundle: liquid500-05
    owner: security
    state: declared
    support: unsupported
    invariant: "One tenant's run cannot read, write or starve another tenant's state."
    runtime_anchor: swfactory.worker_security
    evidence_requirement: "An isolation test across two tenants showing no cross-read and bounded per-tenant share."
  - id: liquid500.provenance-sbom
    slug: provenance-sbom
    family: Liquid500
    bundle: liquid500-05
    owner: security
    state: declared
    support: unsupported
    invariant: "Every published artefact carries provenance identifying the commit, builder and inputs that produced it."
    runtime_anchor: swfactory.provenance
    evidence_requirement: "An SBOM plus signed provenance attestation resolving to the tested commit."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid500.release-promotion
    slug: release-promotion
    family: Liquid500
    bundle: liquid500-06
    owner: operator
    state: declared
    support: unsupported
    invariant: "Promotion is a parent-owned decision made against sealed evidence for an exact commit, never against a moving branch."
    runtime_anchor: swfactory.generations
    evidence_requirement: "A promotion record naming head/base/tested SHAs and the evidence digest it accepted."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid500.deployment-ha
    slug: deployment-ha
    family: Liquid500
    bundle: liquid500-06
    owner: operator
    state: declared
    support: unsupported
    invariant: "Losing any single control-plane process loses no durable state and no in-flight run."
    runtime_anchor: swfactory.runtime
    evidence_requirement: "A kill-one-process drill showing every in-flight run resumed from durable state."
  - id: liquid500.disaster-recovery
    slug: disaster-recovery
    family: Liquid500
    bundle: liquid500-06
    owner: recovery
    state: declared
    support: unsupported
    invariant: "The factory can be rebuilt from the durable store plus the repository, with no hidden local state."
    runtime_anchor: swfactory.reconcile
    evidence_requirement: "A restore-from-backup drill that reproduces the run inventory and drains in-doubt operations."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid500.operator-cli
    slug: operator-cli
    family: Liquid500
    bundle: liquid500-06
    owner: operator
    state: declared
    support: unsupported
    invariant: "The CLI exposes the same operations as the backend contract and refuses anything the backend would refuse."
    runtime_anchor: swfactory.cli
    evidence_requirement: "CLI-versus-backend parity output over the shared contract fixtures."
  - id: liquid500.operator-tui
    slug: operator-tui
    family: Liquid500
    bundle: liquid500-06
    owner: operator
    state: declared
    support: unsupported
    invariant: "The operator surface shows the durable truth (state, epoch, evidence) and never invents a state the store does not hold."
    runtime_anchor: swfactory.product_surface
    evidence_requirement: "A TUI snapshot diffed against the backend's state response for the same run."
  - id: liquid500.backend-api
    slug: backend-api
    family: Liquid500
    bundle: liquid500-07
    owner: operator
    state: declared
    support: unsupported
    invariant: "The backend contract is versioned and additive; a client on an older minor version keeps working."
    runtime_anchor: swfactory.backend.service:Factory
    evidence_requirement: "Contract tests run against the previous released client version."
  - id: liquid500.config-validation
    slug: config-validation
    family: Liquid500
    bundle: liquid500-07
    owner: operator
    state: declared
    support: unsupported
    invariant: "Configuration is validated at load; an invalid configuration refuses to start rather than degrading."
    runtime_anchor: swfactory.contracts
    evidence_requirement: "A start-up refusal on a malformed configuration with the failing field named."
  - id: liquid500.webhooks
    slug: webhooks
    family: Liquid500
    bundle: liquid500-07
    owner: recovery
    state: declared
    support: unsupported
    invariant: "Webhook delivery is verified, deduplicated and replay-safe."
    runtime_anchor: swfactory.webhook
    evidence_requirement: "A replayed signed delivery that changes no state, with the dedupe decision recorded."
  - id: liquid500.human-gates
    slug: human-gates
    family: Liquid500
    bundle: liquid500-07
    owner: airflow
    state: declared
    support: unsupported
    invariant: "An approval is durable, attributable and epoch-bound; it cannot be replayed into a later epoch."
    runtime_anchor: swfactory.lifecycle_evidence
    evidence_requirement: "A stored approval record with approver identity and epoch, plus a rejected cross-epoch replay."
  - id: liquid500.fault-injection
    slug: fault-injection
    family: Liquid500
    bundle: liquid500-07
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Injected faults degrade a run into a recorded, recoverable state, never into silent partial success."
    runtime_anchor: swfactory.fault_evidence
    evidence_requirement: "A fault-injection report mapping each injected fault to the recovery path it took."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid500.conformance
    slug: conformance
    family: Liquid500
    bundle: liquid500-08
    owner: evidence
    state: declared
    support: unsupported
    invariant: "A provider or harness is declared usable only after the conformance suite passes on the tested commit."
    runtime_anchor: swfactory.provider_conformance
    evidence_requirement: "A conformance result set for the tested commit covering every declared capability."
  - id: liquid500.benchmarks
    slug: benchmarks
    family: Liquid500
    bundle: liquid500-08
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Performance claims come from a recorded benchmark on a named environment, not from estimates."
    runtime_anchor: swfactory.evals
    evidence_requirement: "A benchmark run artefact naming the environment, commit and measured distribution."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
  - id: liquid500.performance
    slug: performance
    family: Liquid500
    bundle: liquid500-08
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "Throughput and latency are bounded by declared limits; exceeding a limit throttles rather than degrades correctness."
    runtime_anchor: swfactory.metrics
    evidence_requirement: "Latency and throughput percentiles from a load run against the declared limits."
  - id: liquid500.cache
    slug: cache
    family: Liquid500
    bundle: liquid500-08
    owner: workgraph
    state: declared
    support: unsupported
    invariant: "A cache is an accelerator only; a cold cache changes speed, never the result."
    runtime_anchor: swfactory.state
    evidence_requirement: "A cold-versus-warm run pair producing identical results."
  - id: liquid500.artifacts
    slug: artifacts
    family: Liquid500
    bundle: liquid500-08
    owner: evidence
    state: declared
    support: unsupported
    invariant: "Run artefacts are content-addressed and retained for the promotion window."
    runtime_anchor: swfactory.evidence_store
    evidence_requirement: "An artefact manifest with digests plus a retention check inside the promotion window."
  - id: liquid500.factory-generations
    slug: factory-generations
    family: Liquid500
    bundle: liquid500-09
    owner: authority
    state: experimental
    support: experimental
    invariant: "A child generation is promoted only by its parent, against sealed evidence, and can be rolled back."
    runtime_anchor: swfactory.generations:Generation
    evidence_requirement: "A generation manifest plus the parent's promotion decision and a rehearsed rollback."
    capability_claim: factory.generations
    follow_up: "Promote only when a parent-owned promotion and a rehearsed rollback both run in CI."
    note: "Slug also used by the other liquid family with a different owner; reconcile ownership before promoting either row."
