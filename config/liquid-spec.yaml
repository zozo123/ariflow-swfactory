# The Liquid matrix as data.
#
# The backlog generators produced a 90-domain x 10-concern matrix (900 cells) plus a legacy
# snapshot and three research waves.  That matrix used to exist as 41 near-identical Python
# modules (liquid_bundle_*, physics_bundle_*, legacy_bundle_*) whose only content was this
# metadata.  C10 of the methodology says more issue slices must not imply more permanent
# abstractions, so the matrix lives here, as data, and `python -m swfactory.liquid_spec`
# proves it is not fiction: every runtime_anchor below must resolve to a real module or
# attribute under src/swfactory/, and every capability_claim must exist in
# config/capability-inventory.json.
#
# The file is declarative.  Naming a domain does not make it work.  `state` and `support`
# use the same vocabulary as config/capability-inventory.json, and default to
# declared/unsupported -- aspirational, not covered.  A row is promoted only when it points
# at a validated capability claim.  Do not promote a row to widen the green area.

schema_version: 1

# The intuitive core, which is all the product needs: exploration entropy narrows to a
# stabilized shape and then converges on evidence.  The statistical-mechanics framing
# (Jarzynski, Crooks, nucleation, Onsager) is research vocabulary and lives in
# docs/non-equilibrium-factory.md, not in the runtime's cognitive path.
doctrine:
  phases: [exploration, stabilization, convergence]
  research_notes: docs/non-equilibrium-factory.md

# The seven canonical owning roles.  A domain row's owner must be one of these.
owners: [authority, airflow, workgraph, recovery, security, evidence, operator]

# The concern axis, declared ONCE.  Every domain row below is crossed with all ten,
# which is where 90 x 10 = 900 comes from.  `metric` is the boring, measurable production
# signal for that concern; these ten replace the physics scalars.
concerns:
  - id: C01
    name: invariant
    action: assert_invariant
    metric: in_doubt_operations
    question: "Does the rule hold, and is a violation refused rather than absorbed?"
  - id: C02
    name: persistence
    action: persist
    metric: cleanup_debt
    question: "Does the state survive restart in one durable store, with nothing left dangling?"
  - id: C03
    name: api
    action: expose_versioned_api
    metric: failure_rate
    question: "Is the surface versioned, and does an unknown version get refused?"
  - id: C04
    name: runtime
    action: dispatch_from_airflow
    metric: queue_depth
    question: "Is Airflow the only thing that starts, retries or cancels this?"
  - id: C05
    name: operator
    action: inspect_or_repair
    metric: cancellation_lag
    question: "Can an operator see the truth and repair it without surgery?"
  - id: C06
    name: security
    action: authorize
    metric: sandbox_saturation
    question: "Is the effect authorised before it happens, and does policy fail closed?"
  - id: C07
    name: recovery
    action: recover
    metric: retry_rate
    question: "After a crash or a lost response, does this converge to committed or absent?"
  - id: C08
    name: scale
    action: throttle
    metric: cost
    question: "Under load does this throttle at a bounded gate instead of degrading?"
  - id: C09
    name: evidence
    action: measure_and_seal
    metric: time_to_evidence
    question: "Is every claim backed by a retained artefact bound to an exact commit?"
  - id: C10
    name: stabilize
    action: stabilize_and_delete_superseded
    metric: time_to_merge
    question: "Is the superseded path deleted, so coverage grew without new abstractions?"

