# Toolset line: the default six-stage order on Airflow's OWN sandbox abstraction. A FOURTH DAG
# with zero Python, whose reason to exist is that `--sandbox toolset` must be an exercised path
# and not just a paragraph in docs/design.md: this file is what the blueprint suite, the DAG
# parity suite and `swfactory run --blueprint toolset` all load.
#
# `[sandbox] kind = "toolset"` selects `ToolsetSandbox`, the adapter over the `SandboxBackend` of
# apache-airflow-providers-common-ai (create / destroy / run_command / read_file / write_file).
# WHICH backend it adapts is declared below as `[sandbox].backend` and `.workdir`; an operator can
# still override them with `SWF_TOOLSET_BACKEND` / `SWF_TOOLSET_WORKDIR`. `sbx` ships in the
# released provider; islo / opensandbox / asciibox remain upstream work. A backend that is not
# installed fails as a StageError naming the missing integration, never as an import crash.
#
#   uv run swfactory run --blueprint toolset --issue demo/issue.md            # backend sbx
#   SWF_TOOLSET_BACKEND=islo uv run swfactory run --blueprint toolset --issue 42 --agent claude
#
# Deliberately NOT the default: `blueprints/default.toml` (the `factory` line) stays on islo,
# the production boundary. This one is experimental by construction.

[blueprint]
name = "toolset"
version = 1
description = "Toolset line: the default order on Airflow's own SandboxBackend (provider common.ai)"

[trigger]
kind = "manual"

[[targets]]
repo = "zozo123/ariflow-swfactory"
dir = "demo/target"
base_branch = "main"

[stages]
order = ["intent", "spec", "plan", "build_and_test", "review", "deliver"]   # == default.toml

[[gates]]
after = "intent"
artifact = "intent.md"
timeout_h = 1               # schema minimum; auto, so it is the backstop and not a wait
assigned = []
auto = true                 # an unattended run of an experimental line must finish on its own

[[gates]]
after = "plan"
artifact = "plan.md"
timeout_h = 2               # a real human gate, kept short: nobody babysits an experiment
assigned = []
auto = false

[limits]                    # modest: this line is a proving ground, not a delivery line
max_build_iterations = 2
max_review_fixes = 1
max_turns = 30
budget_usd_per_stage = 1.0
budget_usd = 4.0            # per JOB (issue x target)
stage_timeout_h = 2
max_parallel_jobs = 1       # one sandbox at a time while the backend is experimental

[review]
policy = "REVIEW.md"
nit_cap = 3

[sandbox]
kind = "toolset"            # -> ToolsetSandbox(load_toolset_backend(cfg.toolset_backend))
backend = "sbx"             # Airflow SandboxBackend name, or package.module:Class
workdir = "/workspace/repo" # repository root exposed by that backend
ttl_s = 10800               # 3 h; validator: > max(gates[].timeout_h) * 3600 = 7200
idle_s = 600

[deliver]
labels = ["factory", "agent-authored", "toolset"]
