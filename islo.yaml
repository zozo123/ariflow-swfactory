# islo sandbox config, applied from the factory repo root when IsloSandbox creates a sandbox
# (`islo use swf-<issue>-<run> --source github://<repo>:<branch> ...`).
# The default image already ships claude, git and gh; the setup script only installs uv.
# `uv sync` runs later in stages.setup() inside the target dir (the repo root has no pyproject
# to sync in every target). The Anthropic key reaches the sandbox only as a phantom token via the
# `swfactory` gateway profile (--gateway-secret on the `swfactory` environment); no GitHub write
# token ever enters the sandbox.
sandbox: swfactory
gateway_profile: swfactory
setup_script: |
  command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
  echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.profile"
