# Contract between this repository and the software factory that builds it.
#
# This is the file that makes self-hosting possible. Every other blueprint target points at
# `demo/target` (a toy calculator committed inside this repo); a target with `dir = ""` resolves
# here instead, so a work cell can work on swfactory itself. Without this file the factory refuses
# outright: `stages.seed_local_workdir` raises "a local root target must run from the target
# checkout containing factory.toml", and `config.load_target_contract` raises "target has no
# factory.toml; the factory refuses to guess commands".
#
# `swfactory.config.TargetContract` recognises exactly [commands].test (required),
# [commands].lint, and [paths].{junit, source, tests, protected}. `parse()` hand-picks those keys,
# so anything else is silently dropped rather than rejected: do not add keys expecting effect.

[commands]
# The hermetic Python suite runs with no network (fake subprocess, tmp git repos). The DAG parity
# tests need `uv sync --group airflow`, which a work cell does not have; CI's `airflow-parity` job
# covers those separately.
#
# This command runs INSIDE the work cell (`stages.run_tests` -> `ctx.sb.run(cmd)`), not on the
# orchestrator, and `stages.setup` has already run `uv sync --group dev` there, so it resolves
# from the warm venv. It is deliberately Python-only: `cargo test` would fail in an islo cell
# because the deny-by-default `swfactory` gateway profile allows pypi.org and
# files.pythonhosted.org but no crates.io host, and CLAUDE.md rules out Rust inside a work cell in
# any case. Rust stays the operator's client, verified by CI's `rust` job.
#
# --junitxml is not decoration. `run_tests` deletes that file, runs this command, then parses the
# report; a missing or malformed report is `report_valid=False` and the stage fails even on a zero
# exit code.
test = "uv run --group dev pytest --junitxml=.factory/junit.xml"
# The same gate CI's `test` job applies. Validated by the contract, but no stage executes it
# today: it is declared for humans, `doctor`, and any future lint stage.
lint = "uv run --group dev ruff check . && uv run --group dev ruff format --check ."

[paths]
# Must live below `.factory/` (validator), which is git-ignored and is orchestrator scratch.
junit = ".factory/junit.xml"
# The Python package root; hatch builds `src/swfactory`. `rust/` is the operator's client, never
# cell work, so it is not the declared source and is protected below.
source = "src"
# Writable during `build` (a cell must be able to add tests) and read-only during `fix`
# ("fix the code, not the gate"). `config.protected_for` derives that from this key plus the list
# below: for `fix` it appends the tests dir, for every other stage it removes it.
tests = "tests"

# Read-only inside the work cell. This list reaches the agent two ways: `guard_deny_rules` turns
# every entry into a Claude Code `permissions.deny` rule (every backend), and srt/docker
# additionally enforce it in the kernel (`denyWrite` / a `:ro` bind mount). islo, toolset and boat have
# no `set_protected`, so on the production backend these are agent-enforced only -- which is why
# `.github/workflows/control-plane-gate.yml` re-checks the same list against the base revision.
#
# NEVER list a `src/**` glob here. `sandbox._literal_prefix` reduces each entry to its longest
# wildcard-free prefix, so `src/**/*.py` becomes `src`: the whole package would be mounted `:ro`
# and no build stage could edit any code. Exact file paths are safe -- they have no wildcard, so
# they survive intact.
#
# `REVIEW.md`, `bands.yaml`, `.git/**`, `.claude/**`, `.github/**`, `docs/factory/**` and
# `.factory/**` are already in `agent.GUARD_PATH_DENY` for every target. The Liquid review policy
# and dispatcher are newer control-plane surfaces, so they are repeated explicitly below together
# with the existing contract/CI protections.
protected = [
  "src/swfactory/autonomy_status.py",
  "src/swfactory/__init__.py",
  "src/swfactory/backend/__init__.py",
  "src/swfactory/backend/service.py",
  "src/swfactory/backend/server.py",
  "src/swfactory/backend/core_service.py",
  "src/swfactory/config.py",
  "src/swfactory/blueprint.py",
  "src/swfactory/models.py",
  "src/swfactory/runtime.py",
  "src/swfactory/cell_runtime.py",
  "src/swfactory/cells.py",
  "src/swfactory/state.py",
  "src/swfactory/metrics.py",
  "src/swfactory/scm.py",
  "src/swfactory/core_capabilities.py",
  "src/swfactory/credential_lease.py",
  "src/swfactory/control.py",
  "src/swfactory/prompts/",
  "config/autonomous.toml",
  "src/swfactory/autonomy.py",
  "src/swfactory/backend/autonomous_service.py",
  "src/swfactory/approval_policy.py",
  "src/swfactory/backend/scm_service.py",
  "src/swfactory/backend_scm.py",
  "src/swfactory/backend_http.py",
  "src/swfactory/security_contract.py",
  "src/swfactory/accepted_inputs.py",
  "src/swfactory/linear_source.py",
  "src/swfactory/linear_intake.py",
  "tests/test_autonomy.py",
  "REVIEW.md",
  # --- this contract and the checks that police it -------------------------------------------
  "factory.toml",                       # a cell must not rewrite its own contract
  ".github/",                           # nor the required checks that gate its own PR
  "config/capability-inventory.json",   # support claims are a human governance decision
  "docs/future-factory.md",             # recursive-search constitution cannot self-rewrite
  # --- what governs every FUTURE run ----------------------------------------------------------
  "blueprints/",                        # gates, limits, budgets and sandbox of every line
  "dags/",                              # Airflow is the only lifecycle scheduler
  "scripts/",                           # release, e2e and stress entry points
  "pyproject.toml",                     # the Python verification environment itself
  "uv.lock",
  "Cargo.toml",                         # root Cargo workspace / native Rust graph identity
  "Cargo.lock",                         # exact Rust dependency resolution
  "rust-toolchain.toml",                # compiler + rustfmt/clippy component identity
  "rustfmt.toml",                       # format gate semantics
  "turbo.json",                         # local build graph; acceleration must not become self-editable

  "AGENTS.md",                          # canonical agent contract; CLAUDE.md symlinks here
  "CLAUDE.md",                          # compatibility symlink for Claude Code
  "REVIEW_LIQUID.md",                   # annealed-review authority is human-maintained
  # --- the confinement itself: editing these is how a run would widen its own cage ------------
  "src/swfactory/agent.py",             # tool policy, GUARD_PATH_DENY, guard installation
  "src/swfactory/sandbox.py",           # every sandbox backend and its argv
  "src/swfactory/smolvm_backend.py",    # SmolVM confinement and host-owned recovery
  "src/swfactory/sandbox_contract.py",
  "src/swfactory/stages.py",            # canonical stage semantics
  "src/swfactory/stage_registry.py",    # managed stage dispatch, including Liquid review
  "src/swfactory/liquid_annealing.py",  # material-defect convergence and evidence semantics
  "src/swfactory/phase_control.py",       # factory-wide phase/mode contract is human-maintained
  "src/swfactory/recursive_search.py",      # meta-search may adapt experiments, never itself mid-run
  "src/swfactory/swarm_dynamics.py",        # population/compute policy is human-maintained here
  "src/swfactory/adaptive_information.py",   # measured search-budget policy cannot rewrite itself mid-run
  "src/swfactory/population_manifest.py",     # provider-neutral swarm execution contract is protected
  "src/swfactory/provider_binding.py",       # provider choice binding cannot self-widen mid-run
  "src/swfactory/population_execution.py",     # managed search fan-out cannot widen its own authority
  "src/swfactory/population_adapter.py",       # backend provider/credential contract is protected
  "src/swfactory/backend_population.py",        # worker may reach providers only through backend authority
  "src/swfactory/backend/population_service.py", # paid provider effects are backend-owned and journaled
  "src/swfactory/authority.py",            # canonical mutable-resource authority map is constitutional
  "src/swfactory/security_boundary.py",
  "src/swfactory/security_contract.py",
  "src/swfactory/worker_security.py",
  # --- fix the code, not the gate --------------------------------------------------------------
  "tests/",                             # removed for build, re-added for fix by protected_for
  "tests/fixtures/contract/pyproject.toml", # uv/Turbo workspace identity; protected even during build
  "rust/",                              # the operator's client is out of scope for a cell
]
