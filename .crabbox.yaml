# crabbox: sync this dirty checkout to a leased box and run the test suite there.
# Human inner loop: `crabbox run --provider islo -- uv run pytest`
#   (add `-islo-gateway-profile swfactory` when provider=islo).
# Factory wiring: SWF_TESTS=crabbox makes stages.run_tests wrap the target's test command in
# `crabbox run -provider <SWF_CRABBOX_PROVIDER> -junit ... -artifact-glob ...` on the LOCAL
# sandbox only (never nested inside islo). Never -allow-env / -env-from-profile / -keep.
profile: swfactory
class: small
sync:
  delete: true
  gitSeed: true
  exclude:
    - .venv
    - .factory
    - airflow_home
    - __pycache__
    - ".env*"
env:
  allow:
    - CI
jobs:
  test: uv run pytest
  demo: uv run swfactory demo
