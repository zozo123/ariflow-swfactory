[project]
name = "swfactory"
version = "2.0.1"
description = "AI-native software factory: Airflow 3 orchestrates Claude Code agents in isolated sandboxes and ships reviewed PRs through human gates."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "zozo123" }]
keywords = ["airflow", "ai-agents", "software-factory", "devsecops", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Apache Airflow",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "typer>=0.16",
  "pyyaml>=6",
  "textual>=0.86",
]

[project.urls]
Homepage = "https://github.com/zozo123/ariflow-swfactory"
Documentation = "https://zozo123.github.io/ariflow-swfactory/"
Issues = "https://github.com/zozo123/ariflow-swfactory/issues"
Repository = "https://github.com/zozo123/ariflow-swfactory.git"
Changelog = "https://github.com/zozo123/ariflow-swfactory/blob/main/CHANGELOG.md"

[project.scripts]
swfactory = "swfactory.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
# Default: the latest Airflow RELEASE. `common-ai` ships Airflow's own sandbox toolset, so
# `--sandbox toolset` works with the sbx backend (SWF_TOOLSET_BACKEND, default sbx) once the
# `sbx` binary is on PATH; there is no --backend flag.
airflow = [
  "apache-airflow==3.3.1",
  "apache-airflow-providers-standard==1.18.0",
  "apache-airflow-providers-common-ai>=0.8.0",
]
# Optional outer composition layer. It discovers ``SoftwareFactory`` through the package entry
# point and triggers the existing governed line DAG; it does not replace swfactory's policy.
astronomer-blueprint = ["airflow-blueprint==0.4.0"]
# Bleeding edge: apache/airflow@main plus the pending islo sandbox backend (apache/airflow#71672)
# is one script, not a locked group — locking a git dependency on the Airflow monorepo would clone
# ~1 GB and pin a commit that is stale the next day. See scripts/airflow_main.sh and docs/design.md.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swfactory"]

[tool.hatch.build.targets.wheel.force-include]
"blueprints" = "swfactory/_assets/blueprints"
"demo" = "swfactory/_assets/demo"
".claude/hooks" = "swfactory/_assets/.claude/hooks"
"REVIEW.md" = "swfactory/_assets/REVIEW.md"
"bands.yaml" = "swfactory/_assets/bands.yaml"
"islo.yaml" = "swfactory/_assets/islo.yaml"

[project.entry-points."airflow_blueprint.blueprints"]
swfactory = "swfactory.astronomer_blueprint"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
