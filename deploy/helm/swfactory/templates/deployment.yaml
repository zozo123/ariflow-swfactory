apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: swfactory
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swfactory
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swfactory
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Release.Name }}-backend
      terminationGracePeriodSeconds: 45
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["swfactory", "backend", "--host", "0.0.0.0", "--port", "{{ .Values.service.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: SWF_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.tokenSecret.name }}
                  key: {{ .Values.backend.tokenSecret.key }}
            - name: AIRFLOW_URL
              value: {{ required "backend.airflow.url is required" .Values.backend.airflow.url | quote }}
            - name: AIRFLOW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.airflow.tokenSecret.name }}
                  key: {{ .Values.backend.airflow.tokenSecret.key }}
            - name: SWF_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.postgres.dsnSecret.name }}
                  key: {{ .Values.backend.postgres.dsnSecret.key }}
            - name: SWF_REPO
              value: {{ .Values.backend.repo | quote }}
            - name: SWF_OWNER
              value: {{ .Values.backend.owner | quote }}
            - name: SWF_GENERATION
              value: {{ .Values.backend.generation | quote }}
            - name: SWF_DRAIN
              value: {{ ternary "1" "0" .Values.backend.drain | quote }}
          readinessProbe:
            httpGet:
              path: /v1/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -TERM 1; sleep 10"]
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /state
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          emptyDir: {}
